AWSTemplateFormatVersion: '2010-09-09'
Description: >
  billbaran.us: a static site on a private S3 bucket behind CloudFront (HTTPS,
  apex + www), with a GitHub Actions deploy role (OIDC, no long-lived keys).
  Deploy in us-east-1: CloudFront only accepts ACM certificates from there.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique bucket name for the site files.
  DomainName:
    Type: String
    Default: billbaran.us
    Description: Apex domain. www.<DomainName> redirects to it.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone for DomainName.
  GitHubRepo:
    Type: String
    Default: wkbaran/billbaran.us
    Description: owner/name of the repo whose main branch may deploy.
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      'true' only if this account has no token.actions.githubusercontent.com
      OIDC provider yet (an account can have one, and other stacks may own it).

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  # ---- storage -------------------------------------------------------------
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this distribution may read the bucket.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ---- TLS -------------------------------------------------------------------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub 'www.${DomainName}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId

  # ---- edge ------------------------------------------------------------------
  # www -> apex, and /path/ or /path -> /path/index.html (Astro's directory output).
  RouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-router'
      AutoPublish: true
      FunctionConfig:
        Comment: www redirect and directory index
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          var host = req.headers.host && req.headers.host.value;
          if (host === 'www.${DomainName}') {
            var qs = Object.keys(req.querystring).map(function (k) { return k + '=' + req.querystring[k].value; }).join('&');
            return { statusCode: 301, statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + req.uri + (qs ? '?' + qs : '') } } };
          }
          if (req.uri.endsWith('/')) req.uri += 'index.html';
          else if (!req.uri.split('/').pop().includes('.')) {
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: req.uri + '/' } } };
          }
          return req;
        }

  # Inline scripts are needed by Astro's small islands and by the demo shim.
  # Frames: the demos are same-origin; Equity Watch's chart panel uses
  # TradingView's official embed widget.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: false, Preload: false, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: SAMEORIGIN, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data:;
              connect-src 'self';
              frame-src 'self' https://s.tradingview.com;
              frame-ancestors 'self';
              base-uri 'self';
              form-action 'self';
              object-src 'none'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: [!Ref DomainName, !Sub 'www.${DomainName}']
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: '' }
            OriginAccessControlId: !Ref OAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized (honours object Cache-Control)
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          AllowedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # A private bucket answers 403 for a missing key.
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

  # ---- DNS -------------------------------------------------------------------
  # Only the apex and www A/AAAA records. MX and TXT records for mail
  # forwarding are managed separately (see README).
  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
        - Name: !Sub 'www.${DomainName}'
          Type: A
          AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }
        - Name: !Sub 'www.${DomainName}'
          Type: AAAA
          AliasTarget: { HostedZoneId: Z2FDTNDATAQYW2, DNSName: !GetAtt Distribution.DomainName }

  # ---- deploy role (GitHub Actions OIDC) ---------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Deploys ${DomainName} from ${GitHubRepo} (main only)'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  SiteUrl:
    Value: !Sub 'https://${DomainName}/'
  BucketName:
    Description: Repo variable SITE_BUCKET
    Value: !Ref Bucket
  DistributionId:
    Description: Repo variable SITE_DISTRIBUTION_ID
    Value: !Ref Distribution
  DeployRoleArn:
    Description: Repo variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
